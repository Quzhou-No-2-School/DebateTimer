# Dependabot 版本更新：每周检查一次依赖。
# minor+patch 分组出 PR 降低噪音；major 单独出 PR 便于审查。
version: 2
updates:
  # 前端：SvelteKit + npm，manifest 在仓库根
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # TypeScript 7（Go 原生重写版）当前被所有 @sveltejs/kit 版本的 peer 范围拒绝
    # （连 kit 3.0.0 也只接受 ^6.0.0），升上去 npm ci 必然 ERESOLVE。
    # 待 kit 扩大 peer 范围后再恢复 major 更新。
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # 以下均为 devDependency 传递依赖（wdio e2e / 构建工具链），
      # 永远不会进入 Tauri 发布产物，安全警报无实际暴露面。
      # 对应警报已于 2026-11-03 人工 dismiss（not_used）。
      # 注意：ignore 只抑制 PR，不阻止新警报产生；若依赖链变更使它们
      # 进入运行时产物，需重新评估并移除对应条目。
      - dependency-name: "undici"
      - dependency-name: "minimatch"
      - dependency-name: "glob"
      - dependency-name: "smol-toml"
      - dependency-name: "ip-address"
      - dependency-name: "serialize-javascript"
      - dependency-name: "deepmerge"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        update-types: ["patch", "minor", "major"]

  # Rust：Tauri 后端，manifest 在 src-tauri
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        update-types: ["patch", "minor", "major"]

  # GitHub Actions workflow 里引用的 action 版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        update-types: ["patch", "minor", "major"]
