# Dependabot 版本更新：每周检查一次依赖。
# minor+patch 分组出 PR 降低噪音；major 单独出 PR 便于审查。
version: 2
updates:
  # 前端：SvelteKit + npm，manifest 在仓库根
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # TypeScript 7（Go 原生重写版）当前被所有 @sveltejs/kit 版本的 peer 范围拒绝
    # （连 kit 3.0.0 也只接受 ^6.0.0），升上去 npm ci 必然 ERESOLVE。
    # 待 kit 扩大 peer 范围后再恢复 major 更新。
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        update-types: ["patch", "minor", "major"]

  # Rust：Tauri 后端，manifest 在 src-tauri
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        update-types: ["patch", "minor", "major"]

  # GitHub Actions workflow 里引用的 action 版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        update-types: ["patch", "minor", "major"]
