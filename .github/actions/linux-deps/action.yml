name: Linux system dependencies
description: Install the system packages Tauri 2 needs to compile on Ubuntu runners.

# 四个 job（quality / test / e2e / package）共用同一份依赖清单，
# 避免某条流水线漏装库、在编译 Rust 依赖图时才报 pkg-config 找不到。
# 不需要 webkit2gtk-driver：e2e 用 embedded provider，WebDriver 服务在应用进程内。

inputs:
  xvfb:
    description: Also install Xvfb for the headless e2e run.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install apt packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential curl wget file patchelf \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libssl-dev \
          libxdo-dev \
          libsoup-3.0-dev
        if [ "${{ inputs.xvfb }}" = "true" ]; then
          sudo apt-get install -y --no-install-recommends xvfb
        fi
