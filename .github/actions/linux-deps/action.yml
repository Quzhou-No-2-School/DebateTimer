name: Linux system dependencies
description: Install the system packages Tauri 2 needs to compile on Ubuntu runners.

# 四个 job（quality / test / e2e / package）共用同一份依赖清单，
# 避免某条流水线漏装库、在编译 Rust 依赖图时才报 pkg-config 找不到。
# 不需要 webkit2gtk-driver：e2e 用 embedded provider，WebDriver 服务在应用进程内。

inputs:
  xvfb:
    description: Also install Xvfb for the headless e2e run.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install apt packages
      shell: bash
      run: |
        set -euo pipefail
        # apt 在托管 runner 上偶发挂死（镜像抖动），曾把一个 job 卡在 apt 步骤 20 分钟。
        # 用 Acquire::Retries + timeout 兜底，失败后整体重试，最多 3 次。
        ARGS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
        updated=0
        for attempt in 1 2 3; do
          if timeout 300 sudo apt-get $ARGS update; then updated=1; break; fi
          echo "apt-get update failed (attempt ${attempt}), retrying"
          sleep 10
        done
        if [ "$updated" -ne 1 ]; then
          echo "::error::apt-get update failed after 3 attempts"
          exit 1
        fi
        timeout 600 sudo apt-get $ARGS install -y --no-install-recommends \
          build-essential curl wget file patchelf \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libssl-dev
        if [ "${{ inputs.xvfb }}" = "true" ]; then
          timeout 300 sudo apt-get $ARGS install -y --no-install-recommends xvfb
        fi
