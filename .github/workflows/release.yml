name: Release

# 只在 v* tag 上发布，产物由 package.yml 构建（与 main / PR 同一条路径）。
# 流程：校验版本号 → 四行矩阵打包 → 汇总 artifact + 校验和 → 建 draft release。
# 发布前 draft 需人工确认；重跑本 workflow 不会重复建 release（softprops 覆盖同名）。

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # tag / package.json / tauri.conf.json 三处版本必须一致，否则拒绝发布。
      # 这一步能挡住「tag 打了但忘了改版本号」这类最常见的发布事故。
      - name: Check tag matches manifests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          tauri="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=${tag} package.json=${pkg} tauri.conf.json=${tauri}"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$tauri" ]; then
            echo "::error::tag ${TAG} does not match package.json ${pkg} / tauri.conf.json ${tauri}"
            exit 1
          fi

  package:
    name: Build installers
    needs: verify-version
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    with:
      artifact_prefix: DebateTimer
      upload_artifacts: true

  publish:
    name: Publish draft release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          find . -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          files: dist/**/*
