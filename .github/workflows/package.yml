name: Package

# 可复用工作流：四行矩阵产出三平台安装包，上传为 workflow artifact。
# 调用方：ci.yml（main / 手动 / PR 贴 ci:package 标签）与 release.yml（v* tag）。
#
# 只负责打包，不创建 release；发布由 release.yml 汇总所有 artifact 统一处理。
# 这样 tag 发布可以重跑，且和 main 上验过的构建路径完全一致。

on:
  workflow_call:
    inputs:
      artifact_prefix:
        description: Prefix for artifact names.
        required: false
        type: string
        default: DebateTimer
      upload_artifacts:
        description: Upload the installers as workflow artifacts.
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      artifact_prefix:
        description: Prefix for artifact names.
        required: false
        type: string
        default: DebateTimer
      upload_artifacts:
        description: Upload the installers as workflow artifacts.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 是 Linux 产物的基线：glibc 2.35，能覆盖 22.04 及以上的发行版。
          # 注意 e2e 跑在 24.04，与该行不是同一镜像。
          - label: linux-x86_64
            os: ubuntu-22.04
            args: "--bundles deb,appimage"
            patterns: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          # WiX/MSI 不支持非 ASCII productName，Windows 只出 NSIS。
          - label: windows-x64
            os: windows-2022
            args: "--bundles nsis"
            patterns: |
              src-tauri/target/release/bundle/nsis/*.exe
          - label: macos-arm64
            os: macos-15
            args: "--bundles dmg --target aarch64-apple-darwin"
            rust_targets: aarch64-apple-darwin
            patterns: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - label: macos-x64
            os: macos-15
            args: "--bundles dmg --target x86_64-apple-darwin"
            rust_targets: x86_64-apple-darwin
            patterns: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.rust_targets || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      # 刻意不用 tauri-action：它把构建和发布耦合在一起，而这里只需要打包。
      # 通过 npm 脚本调用 CLI，bash 与 pwsh 下是同一条命令。
      - name: Build installers
        run: npm run tauri -- build ${{ matrix.args }}

      # 保留旧发布里的便携版 exe（免安装，教室机器直接拷走）。
      - name: Add portable exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/tauri-app.exe" `
            "src-tauri/target/release/bundle/nsis/辩论计时器_${version}_x64-portable.exe"

      - name: Upload installers
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.label }}-${{ github.sha }}
          path: ${{ matrix.patterns }}
          if-no-files-found: error
          retention-days: 14
