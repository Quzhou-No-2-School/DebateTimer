name: Enable dependency auto-merge

# Dependabot PR 自动合并：这里只开启 GitHub 原生 auto-merge，不轮询 check。
# 合并由仓库 ruleset `protect-main` 把关：required check 是 `Gate · all checks`，
# 只有 gate 变绿后 GitHub 才会真正 squash 合并。
#
# 参考：not-exist/SuperUp366 的 dependabot-automerge.yml。
#
# 安全边界：pull_request_target 持有写 token，本 workflow 不 checkout PR 内容、
# 不执行 PR 里的代码，只调用 gh API。不要在这里加 actions/checkout。
#
# 前置条件：仓库开启 Allow auto-merge，且 main 的 ruleset 要求 `Gate · all checks`；
# 否则 `--auto` 会在没有 required checks 时立即合并，等于跳过 CI。

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'dependencies') &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          # synchronize 会重复触发；已开启 auto-merge 时直接跳过，保证幂等。
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            echo "auto-merge 已开启，跳过"
            exit 0
          fi
          gh pr merge "$PR_URL" --auto --squash
