[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# E2E testing only: embedded W3C WebDriver server + the wdio execute/mock
# plugin used by @wdio/tauri-service (browser.tauri, window-state polling).
# Never present in release builds.
[target.'cfg(debug_assertions)'.dependencies]
# Git-pinned at webdriverio/desktop-mobile#687: tauri 2.12 moved to
# webview2-com 0.39 (semver-incompatible) and the 1.4.0 registry release
# stops compiling on Windows against it. Revert to "1" once a release
# newer than 1.4.0 lands on crates.io.
tauri-plugin-wdio-webdriver = { git = "https://github.com/webdriverio/desktop-mobile", rev = "e4bdb66ec5b1d96b7fd766d70370a8e8361e0459" }
tauri-plugin-wdio = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
